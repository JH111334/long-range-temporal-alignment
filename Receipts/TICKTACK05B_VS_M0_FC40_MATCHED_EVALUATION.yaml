scientific_verdict:
  claim_m0_beats_ticktack_inspired:
    status: "REFUTED"
    rationale: "TickTack-inspired achieves 35.19% +- 1.40% vs M0-FC40 32.22% +- 0.00% across all 3 seeds (delta: +2.97 pp in favor of TickTack)."
  claim_m0_beats_base_model:
    status: "REFUTED_NO_GAIN"
    rationale: "M0-FC40 matches the frozen base model exactly (32.22% vs 32.22%, delta: 0.00 pp across all 180 questions)."
  claim_ticktack_beats_base_model:
    status: "SUPPORTED_MODEST_GAIN"
    rationale: "TickTack-inspired improves over the frozen base model by +2.97 pp (35.19% vs 32.22%)."
  cross_scale_paper_comparison:
    status: "REFUTED_INVALID_COMPARISON"
    rationale: "Paper Table 1 evaluated Qwen2.5-3B (64.96%) and 7B (74.29%) with undisclosed split; 0.5B architecture cannot be directly compared to 3B numbers."

methodological_confounds:
  attribution_warning: >
    Comparison between M0-FC40 and B_TICKTACK_INSPIRED_05B is a whole-method comparison, not an isolated MaT-LoRA ablation.
    Key differing factors include: (1) Temporal injection point (Input Embedding at year token vs Gated Residual Seam),
    (2) Adapted module family (Attention q,k,v,o LoRA vs MLP MaT-LoRA), (3) Auxiliary loss (Temporal contrastive vs Pure NTP),
    and (4) Regularization (LoRA EWC vs none).

