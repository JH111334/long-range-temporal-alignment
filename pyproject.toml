[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "long-range-temporal-alignment"
version = "0.1.0"
description = "Reproducible contracts and baselines for long-range temporal alignment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JH111334" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
research = ["datasets", "numpy", "peft", "torch", "transformers"]

[project.scripts]
temporal-alignment = "temporal_alignment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
