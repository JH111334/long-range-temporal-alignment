[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "long-range-temporal-alignment"
version = "0.1.0"
description = "Reproducible contracts and baselines for long-range temporal alignment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JH111334" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]
research = [
    "accelerate>=1,<2",
    "datasets>=3,<5",
    "numpy>=2,<3",
    "peft>=0.15,<1",
    "psutil>=6,<8",
    "safetensors>=0.5,<1",
    "torch>=2.6,<3",
    "transformers>=4.51,<5",
]
ui = ["streamlit>=1.44,<2"]

[project.scripts]
temporal-alignment = "temporal_alignment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
